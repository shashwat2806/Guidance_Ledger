services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guidanceledger
      POSTGRES_PASSWORD: guidanceledger
      POSTGRES_DB: guidanceledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guidanceledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://guidanceledger:guidanceledger@postgres:5432/guidanceledger
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
